:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#19263b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}.sidebar{background:#182439;color:white;padding:26px 16px;display:flex;flex-direction:column;gap:8px}.logo{font-weight:800;font-size:21px;margin:8px 12px 30px}.logo span{color:#5ae0c2}.nav{width:100%;text-align:left;border:0;background:transparent;color:#b9c7dc;padding:14px;border-radius:12px}.nav.active,.nav:hover{background:#30445f;color:white}.nav .ico{display:inline-block;width:28px}.foot{margin-top:auto;font-size:12px;color:#9cb0c8;padding:12px}.main{max-width:1220px;width:100%;margin:0 auto;padding:32px 38px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}h1{font-size:29px;letter-spacing:-.8px;margin:0}h2{font-size:18px;margin:0 0 16px}p{margin:5px 0;color:#708097}.muted{color:#71819a;font-size:13px}.btn{background:#266bd7;color:white;border:0;padding:11px 17px;border-radius:11px;font-weight:650}.btn.alt{background:#e8eef8;color:#294369}.btn.danger{background:#ffebeb;color:#b52b3c}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e5eaf3;border-radius:18px;padding:21px;box-shadow:0 5px 18px #1a3b6b06}.metric{font-size:27px;font-weight:800;letter-spacing:-.7px;margin-top:12px}.accent{color:#0c9b83}.blue{color:#3476db}.orange{color:#d68a22}.red{color:#d14958}.split{display:grid;grid-template-columns:1.35fr 1fr;gap:17px;margin-top:18px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar{height:9px;background:#eef2f8;border-radius:9px;overflow:hidden;margin:8px 0 16px}.fill{height:100%;border-radius:9px}.pill{font-size:11px;padding:5px 9px;border-radius:20px;background:#e ottom:15px}.section{margin-top:23px}.rowactions{display:flex;gap:7px;flex-wrap:wrap}.hide{display:none!important}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #edf0f5}th{color:#6c7c94}td:last-child,th:last-child{text-align:right}.color{width:11px;height:11px;display:inline-block;border-radius:50%;margin-right:7px}.fab{display:none}@media(max-width:850px){.app{display:block}.sidebar{position:fixed;bottom:0;left:0;right:0;height:68px;z-index:5;flex-direction:row;justify-content:space-around;padding:7px;background:#182439}.logo,.foot{display:none}.nav{font-size:10px;text-align:center;padding:6px 3px;flex:1}.nav .ico{display:block;width:auto;font-size:20px;margin-bottom:3px}.main{padding:24px 16px 100px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.top{align-items:flex-start}h1{font-size:24px}.card{padding:16px}.metric{font-size:23px}.formgrid{grid-template-columns:1fr 1fr}.fab{display:block;position:fixed;right:18px;bottom:82px;z-index:4;box-shadow:0 7px 20px #173f8e55}.desktopadd{display:none}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo">● House<span>hold</span></div><button class="nav active" data-page="home"><span class="ico">⌂</span>Home</button><button class="nav" data-page="activity"><span class="ico">≡</span>Activity</button><button class="nav" data-page="budgets"><span class="ico">◉</span>Budgets</button><button class="nav" data-page="planning"><span class="ico">▦</span>Planning</button><button class="nav" data-page="settings"><span class="ico">⚙</span>Settings</button><div class="foot">Cloud-ready beta · Sign in under Settings</div></aside><main class="main"><div id="content"></div></main></div><button class="btn fab" id="fab">＋ Add</button><div id="modalRoot"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const STORE='household-finance-v1';const cats=[['Rent','#5674ce','Fixed',1950],['Groceries','#10a58d','Variable',650],['Dining','#eda64b','Variable',350],['Utilities','#6c94d6','Fixed',240],['Travel','#9875df','Variable',250],['Health','#e56c8a','Variable',200],['Pet','#d58d50','Variable',180],['Gas','#e07863','Variable',160],['Household','#579d9e','Variable',200],['Subscriptions','#7a7cce','Fixed',100],['Car Insurance','#4b86ae','Fixed',150],['Car Payments','#7790bd','Fixed',400],['Clothing','#b277bd','Variable',120],['Entertainment','#b7a04d','Variable',150],['Personal','#7283a8','Variable',100],['Other','#8c97a7','Variable',100]];
const initial=()=>({version:1,transactions:[],budgets:Object.fromEntries(cats.map(x=>[x[0],x[3]])),categories:cats.map(x=>({name:x[0],color:x[1],classification:x[2]})),paymentMethods:['Credit Card','Debit Card','Checking','Cash'],reviewedTransactions:{},dailyReviews:{},recurring:[],statementImports:[],matches:{},exceptions:{},merchantRules:[],settings:{month:new Date().toISOString().slice(0,7),payer:'Luis'}});
let state;try{state=JSON.parse(localStorage.getItem(STORE))||initial()}catch{state=initial()}if(!state.categories||!state.budgets)state=initial();state.merchantRules=Array.isArray(state.merchantRules)?state.merchantRules:[];state.transactions.forEach(t=>{if(t.type==='reimbursement'&&t.amount>0)t.amount=-t.amount});let page='home',activityTab='timeline',filter='all';
const save=()=>{localStorage.setItem(STORE,JSON.stringify(state));window.cloudChanged?.()};const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const today=()=>new Date().toLocaleDateString('en-CA');const monthTx=()=>state.transactions.filter(t=>t.date.slice(0,7)===state.settings.month&&!t.excluded);const color=c=>state.categories.find(x=>x.name===c)?.color||'#8290a6';const total=(arr,fn)=>arr.filter(fn).reduce((s,t)=>s+t.amount,0);const expenses=arr=>total(arr,t=>t.type==='expense'||t.type==='reimbursement');const gross=arr=>total(arr,t=>t.type==='expense');const refunds=arr=>-total(arr,t=>t.type==='reimbursement');const income=arr=>total(arr,t=>t.type==='income');const savings=arr=>total(arr,t=>t.type==='savings');const budgetTotal=()=>Object.values(state.budgets).reduce((a,b)=>a+Number(b||0),0)*100;const categorySpent=(c,arr=monthTx())=>total(arr,t=>t.category===c&&(t.type==='expense'||t.type==='reimbursement'));const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});const rangeDays=()=>{let [y,m]=state.settings.month.split('-').map(Number),last=new Date(y,m,0).getDate(),out=[];for(let d=Math.min(last,state.settings.month===today().slice(0,7)?Number(today().slice(8)):last);d>=1;d--)out.push(state.settings.month+'-'+String(d).padStart(2,'0'));return out};
function heading(name,sub,add=true){return `<div class="top"><div><h1>${name}</h1><p>${sub}</p></div>${add?'<button class="btn desktopadd" data-action="add">＋ Add transaction</button>':''}</div>`}
function metric(label,value,cls='',sub=''){return `<div class="card"><div class="muted">${label}</div><div class="metric ${cls}">${value}</div><div class="muted">${sub}</div></div>`}
function home(){const arr=monthTx(),spent=expenses(arr),budget=budgetTotal(),remaining=budget-spent,inc=income(arr),sav=savings(arr);let lines=state.categories.map(c=>({c,spent:categorySpent(c.name),budget:(state.budgets[c.name]||0)*100})).filter(x=>x.budget||x.spent).sort((a,b)=>b.spent-a.spent);let reviewed=rangeDays().filter(d=>dayComplete(d)).length;return heading('Your household','Financial overview for '+state.settings.month)+`<div class="toolbar"><input class="field" type="month" id="month" value="${state.settings.month}"></div><div class="grid">${metric('Net spending',money(spent),'blue','Gross '+money(gross(arr))+' · Refunded '+money(refunds(arr)))}${metric('Budget remaining',money(remaining),remaining<0?'red':'accent','Of '+money(budget)+' planned')}${metric('Income received',money(inc),'','Actual logged income')}${metric('Cash after savings',money(inc-spent-sav),inc-spent-sav<0?'red':'accent','Savings allocated '+money(sav))}</div><div class="split"><section class="card"><h2>Budget by category</h2>${lines.map(({c,spent,budget})=>`<div class="line"><div><span class="color" style="background:${c.color}"></span>${esc(c.name)} <span class="muted">· ${esc(c.classification)}</span></div><strong>${money(spent)} / ${money(budget)}</strong></div><div class="bar"><div class="fill" style="background:${c.color};width:${Math.min(100,Math.max(0,budget?spent/budget*100:spent?100:0))}%"></div></div>`).join('')||'<div class="empty">Set a budget to get started.</div>'}</section><section><div class="card"><h2>Review progress</h2><div class="metric">${reviewed} / ${rangeDays().length}</div><p>Days fully reviewed this month</p><div class="bar"><div class="fill" style="width:${rangeDays().length?reviewed/rangeDays().length*100:0}%;background:#10a58d"></div></div><button class="btn alt" data-go="activity">Review transactions</button></div><div class="card section"><h2>Recent activity</h2><div class="list">${arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(t=>transactionRow(t,false)).join('')||'<div class="empty">No transactions yet. Add your first purchase.</div>'}</div></div></section></div>`}
function transactionRow(t,check=true){let negative=t.type==='expense'||t.type==='savings';return `<div class="item"><div class="symbol" style="background:${color(t.category)}22;color:${color(t.category)}">${esc((t.merchant||'?').slice(0,1).toUpperCase())}</div><div class="detail"><strong>${esc(t.merchant)}</strong><span class="muted">${esc(t.category||t.type)} · ${esc(t.payer)} · ${esc(t.paymentMethod)} ${t.excluded?'· Excluded':''}</span></div><div style="text-align:right"><div class="value ${t.type==='reimbursement'||t.type==='income'?'accent':''}">${negative?'−':'+'}${money(Math.abs(t.amount))}</div>${check?`<label class="muted"><input class="reviewbox" type="checkbox" data-check="${t.id}" ${state.reviewedTransactions[t.id]?'checked':''}> Checked</label>`:''}</div><button class="btn alt small" data-edit="${t.id}">Edit</button></div>`}
function dayComplete(day){let keys=state.paymentMethods.map(p=>day+'|'+p);return keys.every(k=>state.dailyReviews[k]?.status==='reviewed')}
function activity(){let arr=monthTx().slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));let days=rangeDays();let reviewCount=days.filter(dayComplete).length;return heading('Activity','Chronological transaction log and verification')+`<div class="tabs"><button data-tab="timeline" class="${activityTab==='timeline'?'active':''}">Timeline</button><button data-tab="reconcile" class="${activityTab==='reconcile'?'active':''}">Statement reconciliation</button></div>${activityTab==='timeline'?`<div class="grid">${metric('Transactions',String(arr.length))}${metric('Days reviewed',reviewCount+' / '+days.length,'accent')}${metric('Unchecked entries',String(arr.filter(t=>!state.reviewedTransactions[t.id]).length),'orange')}${metric('Net spending',money(expenses(arr)),'blue')}</div><div class="toolbar section"><input class="field" id="search" placeholder="Search merchant or category" value="${esc(window.searchValue||'')}"><select id="filter"><option value="all">All entries</option><option value="unchecked" ${filter==='unchecked'?'selected':''}>Unchecked only</option><option value="checked" ${filter==='checked'?'selected':''}>Checked only</option></select><input class="field" type="month" id="month" value="${state.settings.month}"></div><div id="timeline">${days.map(d=>{let list=arr.filter(t=>t.date===d&&(!window.searchValue||(t.merchant+' '+t.category).toLowerCase().includes(window.searchValue.toLowerCase()))&&(filter==='all'||(filter==='checked'?!!state.reviewedTransactions[t.id]:!state.reviewedTransactions[t.id])));let count=arr.filter(t=>t.date===d).length;return `<section class="card day"><div class="dayhead"><div><h3>${dateLabel(d)}</h3><span class="muted">${count} logged · ${money(expenses(arr.filter(t=>t.date===d)))} net</span></div><span class="pill ${dayComplete(d)?'good':'warn'}">${dayComplete(d)?'Reviewed':'Needs review'}</span></div>${list.map(t=>transactionRow(t)).join('')||'<div class="muted" style="padding:12px 0">No matching transactions for this day</div>'}<div class="rowactions" style="margin-top:12px">${state.paymentMethods.map(p=>{let k=d+'|'+p,done=state.dailyReviews[k]?.status==='reviewed';return `<button class="btn small ${done?'alt':''}" data-review-day="${esc(d)}" data-method="${esc(p)}">${done?'✓':'○'} ${esc(p)}</button>`}).join('')}</div></section>`}).join('')}</div>`:reconciliation()}`}
function reconciliation(){let rows=state.statementImports;return `<div class="notice">CSV statement import is optional. Imported statement rows never automatically become budget transactions. Review all matches before confirming.</div><div class="card"><h2>Import statement</h2><div class="formgrid"><label>Payment method<select class="field" id="statementMethod">${state.paymentMethods.map(p=>`<option>${esc(p)}</option>`).join('')}</select></label><label>CSV file<input class="field" type="file" id="statementFile" accept=".csv,text/csv"></label></div><p class="muted">Required columns: date, description, amount. Positive debits and negative credits, as in the app's expense convention. Other CSV formats can be normalized before importing.</p><button class="btn" data-action="import-statement">Import CSV</button></div>${rows.map(s=>`<div class="card section"><div class="line"><h2>${esc(s.fileName)}</h2><span class="pill ${s.entries.every(e=>state.matches[e.id]||state.exceptions[e.id])?'good':'warn'}">${s.entries.filter(e=>state.matches[e.id]).length}/${s.entries.length} matched</span></div><p>${esc(s.method)} · Imported ${new Date(s.created).toLocaleDateString()}</p>${s.entries.map(e=>{let match=state.matches[e.id],exception=state.exceptions[e.id];return `<div class="item"><div class="detail"><strong>${esc(e.description)}</strong><span class="muted">${esc(e.date)} · ${match?'Matched':exception?'Explained: '+esc(exception):'Unmatched'}</span></div><strong>${money(e.amount)}</strong>${!match&&!exception?`<button class="btn alt small" data-match="${e.id}">Resolve</button>`:''}</div>`}).join('')}</div>`).join('')||'<div class="card section empty">No statements imported yet.</div>'}`}
function budgets(){let arr=monthTx();let fixed=state.categories.filter(c=>c.classification==='Fixed').reduce((s,c)=>s+(state.budgets[c.name]||0),0)*100;return heading('Budgets','Monthly targets and fixed vs variable planning',false)+`<div class="grid">${metric('Total planned',money(budgetTotal()))}${metric('Fixed planned',money(fixed),'blue')}${metric('Variable planned',money(budgetTotal()-fixed),'orange')}${metric('Remaining',money(budgetTotal()-expenses(arr)),budgetTotal()-expenses(arr)<0?'red':'accent')}</div><div class="card section"><div class="line"><h2>Category budgets</h2><button class="btn" data-action="add-category">＋ Add category</button></div><table><thead><tr><th>Category</th><th>Classification</th><th>Target</th><th>Actual</th><th>Remaining</th></tr></thead><tbody>${state.categories.map(c=>{let b=(state.budgets[c.name]||0)*100,a=categorySpent(c.name);return `<tr><td><span class="color" style="background:${c.color}"></span>${esc(c.name)} <button class="btn alt small" data-edit-category="${esc(c.name)}">Edit</button></td><td><select data-class="${esc(c.name)}"><option ${c.classification==='Fixed'?'selected':''}>Fixed</option><option ${c.classification==='Variable'?'selected':''}>Variable</option></select></td><td><input class="field" style="width:100px" type="number" min="0" step="0.01" data-budget="${esc(c.name)}" value="${(b/100).toFixed(2)}"></td><td>${money(a)}</td><td style="color:${b-a<0?'#ce4151':'#148e7d'}">${money(b-a)}</td></tr>`}).join('')}</tbody></table><p class="muted">Targets save automatically when changed. Fixed/variable classification currently uses category defaults; per-budget-line classification will be added in the production backend.</p></div>`}
function planning(){return heading('Planning','Recurring obligations and expected bills',false)+`<div class="card"><div class="line"><h2>Recurring bills</h2><button class="btn" data-action="recurring">＋ Add bill</button></div><table><thead><tr><th>Bill</th><th>Category</th><th>Cadence</th><th>Amount</th><th>Monthly equivalent</th><th></th></tr></thead><tbody>${state.recurring.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.category)}</td><td>${esc(r.frequency)}</td><td>${money(r.amount)}</td><td>${money(Math.round(r.amount/({Monthly:1,Quarterly:3,Annual:12}[r.frequency]||1)))}</td><td><button class="btn danger small" data-delete-bill="${r.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No recurring bills yet.</td></tr>'}</tbody></table></div><div class="notice section">Recurring bills are planning records, not actual transactions. A bill is counted as spent only when you log its payment.</div>`}
function settings(){return heading('Settings','Household configuration and data ownership',false)+`<div class="card" style="margin-bottom:18px"><div class="line"><h2>Shared household cloud</h2><button class="btn" onclick="cloudOpen()">Connect / Manage</button></div><p id="cloudIndicator">${esc(window.cloudStatus||'Local only — no synchronization')}</p></div><div class="card"><h2>Household</h2><p>Shared cloud synchronization is optional. Connect in the panel above; local-only mode remains available.</p><div class="formgrid section"><label>Default payer<select id="payerDefault" class="field"><option ${state.settings.payer==='Luis'?'selected':''}>Luis</option><option ${state.settings.payer==='Spouse'?'selected':''}>Spouse</option><option ${state.settings.payer==='Shared'?'selected':''}>Shared</option></select></label><label>Current month<input type="month" class="field" id="month" value="${state.settings.month}"></label></div></div><div class="card section"><h2>Data management</h2><div class="rowactions"><button class="btn" data-action="export-json">Export full backup</button><button class="btn alt" data-action="export-csv">Export transactions CSV</button><label class="btn alt">Restore backup<input type="file" id="restoreFile" accept=".json" style="display:none"></label><button class="btn danger" data-action="reset">Clear all data</button></div><p>Local data remains in this browser until you create or join a cloud household. Export a backup regularly. Clearing browser data may erase the prototype's records.</p></div><div class="card section"><div class="line"><h2>Spending categories</h2><button class="btn" data-action="add-category">＋ Add category</button></div><div class="rowactions section">${state.categories.map(c=>`<button class="btn alt small" data-edit-category="${esc(c.name)}"><span class="color" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}</div></div><div class="card section"><div class="line"><h2>Merchant auto-categorization</h2><button class="btn" data-action="add-rule">＋ Add rule</button></div><p>When you enter a merchant name, the app suggests the category and payment method from your rules. More specific patterns should come first.</p><table><thead><tr><th>Contains</th><th>Category</th><th>Payment</th><th></th></tr></thead><tbody>${state.merchantRules.map(r=>`<tr><td>${esc(r.pattern)}</td><td>${esc(r.category)}</td><td>${esc(r.paymentMethod||'No default')}</td><td><button class="btn danger small" data-delete-rule="${r.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="4">No merchant rules yet.</td></tr>'}</tbody></table></div><div class="card section"><div class="line"><h2>Payment methods</h2><button class="btn" data-action="add-method">＋ Add payment method</button></div><p class="muted">Use specific names, such as Chase Sapphire Preferred, Amex Gold, or Wells Fargo Checking. Renaming a method preserves its transactions, merchant rules, daily reviews, and statement imports.</p><div class="section">${state.paymentMethods.map(p=>`<div class="item"><div class="symbol" style="background:#e7efff;color:#5274d5">▣</div><div class="detail"><strong>${esc(p)}</strong><span class="muted">${state.transactions.filter(t=>t.paymentMethod===p).length} transactions · ${state.statementImports.filter(x=>x.method===p).length} statement imports</span></div><button class="btn alt small" data-edit-method="${esc(p)}">Edit</button></div>`).join('')}</div></div>`}
function render(){document.getElementById('content').innerHTML=({home,activity,budgets,planning,settings}[page])();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="modal">${html}</div></div>`}function close(){document.getElementById('modalRoot').innerHTML=''}
function categoryForm(oldName){

  $('hfClose').onclick=close;
  $('hfConfigure').onclick=()=>{cfg={url:$('hfUrl').value.trim().replace(/\/$/,''),key:$('hfKey').value.trim()};localStorage.setItem(CFG,JSON.stringify(cfg));init();notify('Connection configured. Sign in to continue.')};
  $('hfSignup').onclick=async()=>{try{if(!client)throw Error('Cloud connection unavailable');const {data,error}=await client.auth.signUp({email:$('hfEmail').value.trim(),password:$('hfPassword').value});if(error)throw error;notify(data.session?'Signed up and authenticated.':'Check email for verification, then sign in.')}catch(e){notify(err(e))}};
  $('hfSignin').onclick=async()=>{try{if(!client)throw Error('Cloud connection unavailable');const {error}=await client.auth.signInWithPassword({email:$('hfEmail').value.trim(),password:$('hfPassword').value});if(error)throw error;const hs=await discover();if(hs.length===1){household=hs[0].household_id;revision=null;dirty=false;blocked=false;await pull(true)}notify('Signed in'+(household?' · household connected':''))}catch(e){notify(err(e))}};
  $('hfSignout').onclick=async()=>{if(client)await client.auth.signOut();household=null;revision=null;dirty=false;blocked=false;clearInterval(poll);notify('Signed out. Local data remains on this browser.')};
  $('hfCreate').onclick=async()=>{try{if(!await session())throw Error('Sign in first');if(!confirm('Create a new household using the CURRENT local data? Do not do this if you intend to join an existing household.'))return;const result=await rpc('hf_create_household',{p_name:$('hfHouse').value.trim(),p_state:window.cloudExport()});household=result;revision=0;dirty=false;blocked=false;notify('Household created · synced revision 0');startPoll()}catch(e){notify(err(e))}};
  $('hfJoin').onclick=async()=>{try{if(!await session())throw Error('Sign in first');if(!confirm('Joining will replace this browser’s current app data with the household cloud data. Export a backup first if needed.'))return;household=await rpc('hf_join_household',{p_code:$('hfInvite').value.trim()});revision=null;dirty=false;blocked=false;await pull(true);notify('Joined household · cloud data loaded');startPoll()}catch(e){notify(err(e))}};
  $('hfInviteBtn').onclick=async()=>{try{if(!household)throw Error('Connect a household first');const code=await rpc('hf_create_invite',{p_household:household});$('hfInvite').value=code;notify('Invite generated. Share the code privately; expires in 24 hours and can be used once.')}catch(e){notify(err(e))}};
  $('hfPull').onclick=()=>pull();
  $('hfRecover').onclick=async()=>{if(!confirm('Discard ALL unsynced local changes and replace them with cloud data? Export a backup first.'))return;blocked=false;dirty=false;revision=null;await pull(true)};
  $('hfBackup').onclick=()=>{const blob=new Blob([JSON.stringify(window.cloudExport(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='household-local-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 };
 function startPoll(){clearInterval(poll);poll=setInterval(()=>{if(!dirty&&!blocked&&document.visibilityState==='visible')pull()},15000)}
 (async()=>{if(!init())return;try{if(!await session())return;const hs=await discover();if(hs.length===1){household=hs[0].household_id;await pull(true);startPoll()}else if(hs.length>1)msg('Multiple households found; choose one in a future release. No automatic sync enabled.')}catch(e){msg('Cloud connection error: '+err(e))}})();
})();
</script>
</body></html>
